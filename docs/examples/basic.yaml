# Basic configuration — encrypt with XChaCha20-Poly1305, Argon2id
encryption:
  algorithm: xchacha20-poly1305
  key_file: ""
  kdf_method: argon2id
  passphrase: "change-me-to-a-strong-passphrase"
  uuid_rename: false
  embed_metadata: false

database:
  encrypt: true
  format: json

directories:
  source: ./data/plain
  output: ./data/encrypted
  decrypted: ./data/decrypted
