name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./cmd/cli/... ./internal/...
      - run: go test -count=1 -timeout 120s ./internal/...

  build-cli:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64, 386]
        exclude:
          - goos: darwin
            goarch: 386
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build CLI
        shell: bash
        run: |
          suffix=""
          if [ "${{ matrix.goos }}" = "windows" ]; then suffix=".exe"; fi
          go build -trimpath \
            -ldflags="-X main.Version=${{ github.ref_name }}" \
            -o bin/kryp-${{ matrix.goos }}-${{ matrix.goarch }}$suffix \
            ./cmd/cli/
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: kryp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/*

  build-gui:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            deps: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            deps: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev xorg-dev
          - os: macos-latest
            goos: darwin
            goarch: amd64
            deps: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            deps: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            deps: choco install mingw -y
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install dependencies
        if: matrix.deps != ''
        run: ${{ matrix.deps }}
      - name: Build GUI
        shell: bash
        run: |
          suffix=""
          ldflags="-X main.Version=${{ github.ref_name }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            suffix=".exe"
            ldflags="$ldflags -H=windowsgui"
          fi
          go build -trimpath \
            -ldflags="$ldflags" \
            -o bin/kryp-gui-${{ matrix.goos }}-${{ matrix.goarch }}$suffix \
            ./cmd/gui/
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: kryp-gui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/*

  release:
    needs: [build-cli, build-gui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kryp-*
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum kryp-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kryp-*
            checksums.txt
          generate_release_notes: true
